<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="65%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c6e03a" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#0d0d0f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="screentone" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0d0f"/>
  <rect width="1200" height="630" fill="url(#screentone)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="#232329" stroke-width="1.5"/>

  <!-- Brand / Logo -->
  <g transform="translate(80, 80)">
    <rect width="48" height="48" rx="12" fill="#16161a" stroke="#c6e03a" stroke-width="2"/>
    <path d="M24 14v20M24 14c-3-2-6.5-2.5-11-2.5v20c4.5 0 8 .5 11 2.5 3-2 6.5-2.5 11-2.5v-20c-4.5 0-8 .5-11 2.5z" fill="none" stroke="#c6e03a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="34" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0.2em" fill="#f4f4f6">
      <tspan fill="#c6e03a">Z</tspan>READER
    </text>
  </g>

  <!-- Status pill -->
  <g transform="translate(80, 160)">
    <rect width="260" height="36" rx="18" fill="#16161a" stroke="#232329" stroke-width="1"/>
    <circle cx="20" cy="18" r="4" fill="#c6e03a"/>
    <text x="34" y="23" font-family="Poppins, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.08em" fill="#f4f4f6">OPEN SOURCE · LICENÇA MIT</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="260" font-family="Poppins, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.03em" fill="#f4f4f6">
    Seu leitor de mangás.
  </text>
  <text x="80" y="325" font-family="Poppins, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-0.03em" fill="#f4f4f6">
    <tspan fill="#c6e03a">Grátis</tspan> e sem rastreadores.
  </text>

  <!-- Description -->
  <text x="80" y="390" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="400" fill="#9a9aa5">
    Moderno, local-first e conectado ao MangaDex.
  </text>
  <text x="80" y="422" font-family="Poppins, Arial, sans-serif" font-size="20" font-weight="400" fill="#9a9aa5">
    Biblioteca sincronizada, downloads offline e zero telemetria.
  </text>

  <!-- Feature Pills / Badges -->
  <g transform="translate(80, 480)">
    <!-- Badge 1: Windows -->
    <rect width="200" height="48" rx="10" fill="#16161a" stroke="#2e2e36" stroke-width="1"/>
    <text x="24" y="30" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f4f6">Windows 64 bits</text>

    <!-- Badge 2: Android -->
    <g transform="translate(216, 0)">
      <rect width="180" height="48" rx="10" fill="#16161a" stroke="#2e2e36" stroke-width="1"/>
      <text x="24" y="30" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f4f6">Android APK</text>
    </g>

    <!-- Badge 3: Sem rastreadores -->
    <g transform="translate(412, 0)">
      <rect width="250" height="48" rx="10" fill="#16161a" stroke="#2e2e36" stroke-width="1"/>
      <text x="24" y="30" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#c6e03a">100% Sem Rastreadores</text>
    </g>

    <!-- Badge 4: MangaDex API -->
    <g transform="translate(678, 0)">
      <rect width="210" height="48" rx="10" fill="#16161a" stroke="#2e2e36" stroke-width="1"/>
      <text x="24" y="30" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#9a9aa5">API MangaDex v5</text>
    </g>
  </g>
</svg>
